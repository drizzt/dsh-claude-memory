name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # `test/schema.mjs` and `test/live.mjs` skip cleanly on a machine with no
      # DSH install and no Claude Code store, so `npm test` is portable.
      - run: npm test
